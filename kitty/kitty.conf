# GUTS | Kitty >= 0.49.1 | Imágenes estáticas
font_family Iosevka Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 15.0
cursor #f38ba8
cursor_text_color #11111b
cursor_shape underline
cursor_shape_unfocused underline
cursor_underline_thickness 2.0
cursor_blink_interval 0
cursor_trail 0
scrollback_lines 10000
url_color #89b4fa
url_style dashed
detect_urls yes
show_hyperlink_targets yes
underline_hyperlinks hover
copy_on_select a1
# Evitar que una V mayúscula pegue texto inesperadamente.
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+insert paste_from_buffer a1
remember_window_size yes
initial_window_width 1700
initial_window_height 888
enabled_layouts splits,tall,stack,grid
window_border_width 1.0px
draw_minimal_borders yes
window_margin_width 1
window_padding_width 2 10 0 10
active_border_color #cba6f7
inactive_border_color #45475a
hide_window_decorations yes
tab_bar_edge bottom
tab_bar_margin_width 1
tab_bar_margin_height 5 0
tab_bar_style powerline
tab_bar_align left
tab_bar_min_tabs 1
tab_powerline_style angled
tab_title_template "󰫣  {title}"
active_tab_title_template "󰫢  {title}"
active_tab_foreground #cdd6f4
active_tab_background #313244
active_tab_font_style bold
inactive_tab_foreground #a6adc8
inactive_tab_background #181825
inactive_tab_font_style normal
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8
include background.conf
# Acciones locales de teclas: no se habilita remote control global.
map ctrl+shift+f11 remote_control set-background-image -1
map ctrl+shift+f12 remote_control set-background-image +1
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end
map ctrl+shift+. next_window
map ctrl+shift+, previous_window
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+backspace close_window
map ctrl+. next_tab
map ctrl+, previous_tab
map ctrl+enter new_tab_with_cwd
map ctrl+backspace close_tab
map ctrl+right move_tab_forward
map ctrl+left move_tab_backward
map ctrl+shift+right next_layout
map ctrl+shift+left last_used_layout
# Ctrl+C interrumpe procesos; Ctrl+S llega al editor; Ctrl+V conserva su semántica.
